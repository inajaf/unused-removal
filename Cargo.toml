[package]
name = "unused-removal"
version = "1.0.0"
edition = "2021"
description = "Fast cross-platform file scanner and cleaner for Windows and macOS"
license = "MIT"
repository = "https://github.com/inajaf/unused-removal"
authors = ["inajaf"]
readme = "README.md"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
console = "0.15"
indicatif = "0.17"
colored = "2.1"

# TUI
ratatui = "0.27"
crossterm = "0.28"

# Configuration
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"

# Cross-platform file operations
trash = "3.0"

# Parallel processing
rayon = "1.10"

# Hashing for duplicates
blake3 = "1.5"
hex = "0.4"

# Database for cache
redb = "1.0"
postcard = { version = "1.0", features = ["alloc", "use-std"] }

# Internal desktop request router
axum = { version = "0.7", features = ["macros", "json", "ws"] }
tokio = { version = "1.38", features = ["full", "rt-multi-thread", "signal"] }
serde_json = "1.0"

# Embedding static files
rust-embed = { version = "8" }
mime_guess = "2.0"

# Desktop shell (optional): native window around the embedded web UI.
tao = { version = "0.30", optional = true }
wry = { version = "0.46", optional = true }
http-body-util = { version = "0.1", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
scopeguard = "1.2"
num_cpus = "1.16"
tempfile = "3.10"
jwalk = "0.9.0"

[features]
desktop = ["dep:tao", "dep:wry", "dep:http-body-util", "dep:tower"]

# Windows API (Windows only)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_Security",
] }

# macOS-specific (for FSEvents or other optimizations)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
